<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그 자리, 그 계절 - 청주 출사 명소 아카이브</title>

  <!-- 표지용 필기체·명조와 본문 서체 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Nanum+Myeongjo:wght@400;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gold-accent.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- 상단 표지: 아치 풍경과 위치 기능 버튼 -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-petals" aria-hidden="true">
          <span class="header-petal"></span>
          <span class="header-petal"></span>
          <span class="header-petal"></span>
          <span class="header-petal"></span>
          <span class="header-petal"></span>
        </div>
        <div class="header-script" aria-hidden="true">our place, our season</div>
        <div class="header-arch" aria-hidden="true">
          <svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
            <circle class="arch-sun-halo" cx="150" cy="220" r="58"></circle>
            <circle class="arch-sun" cx="150" cy="220" r="38"></circle>
            <path class="arch-hill arch-hill-back" d="M0 252 Q55 228 112 246 T218 238 T300 246 V400 H0Z"></path>
            <path class="arch-hill arch-hill-front" d="M0 278 Q78 250 155 271 T300 264 V400 H0Z"></path>
          </svg>
        </div>
        <time id="header-date-line" class="header-date-line">CHEONGJU · PHOTO ARCHIVE</time>
        <div class="header-copy">
          <h1 class="brand-title">그 자리, 그 계절</h1>
          <p class="brand-subtitle">청주 출사 명소 아카이브</p>
        </div>
        <div class="header-flourish" aria-hidden="true">✦</div>
        <button id="btn-request-location" class="btn-gps-sync" type="button" title="내 위치로 가까운 명소 정렬">
          <span class="gps-dot"></span>
          <span id="gps-status-label">내 위치 켜기</span>
        </button>
      </div>
    </header>

    <div id="app-status-notice" class="app-status-notice" role="status" aria-live="polite" hidden></div>

    <!-- 명소 선택 탭 (위치 허용 시 가까운 순 정렬 & 거리 뱃지) -->
    <nav class="spots-nav-section" aria-label="명소 선택">
      <div id="spot-tabs" class="spot-tab-scroll">
        <!-- JS 동적 렌더링 -->
      </div>
    </nav>

    <!-- 명소 요약 카드 (일출·일몰, 주차 가능, 주의 메모) -->
    <section id="spot-summary-card" class="spot-summary-card" aria-live="polite">
      <!-- JS 동적 렌더링 -->
    </section>

    <!-- 4 × 4 매트릭스 갤러리 섹션 -->
    <main class="matrix-section">
      <div class="matrix-header">
        <h2 class="section-title">계절과 빛의 기록 (4×4)</h2>
        <span class="matrix-hint">각 칸을 터치해 사진을 감상해 보세요</span>
      </div>

      <div class="matrix-table-wrap">
        <div id="photo-matrix" class="matrix-grid">
          <!-- JS 동적 렌더링 -->
        </div>
      </div>
    </main>

    <!-- 하단 고정 플로팅 액션 바 (현장 거리 피드백 안내) -->
    <footer class="floating-bottom-bar">
      <div class="action-btn-wrap">
        <button id="btn-open-upload" class="btn-upload-action state-unknown" type="button">
          <span class="btn-icon">📷</span>
          <span id="btn-upload-label" class="btn-text">내 위치 확인 후 현장 등록하기</span>
        </button>
        <p id="upload-distance-notice" class="upload-distance-notice" role="status" aria-live="polite" hidden></p>
      </div>
    </footer>

    <!-- 사진 크게보기 모달 -->
    <div id="photo-detail-modal" class="modal-overlay photo-viewer-modal" role="dialog" aria-modal="true">
      <div class="modal-sheet">
        <div class="sheet-header">
          <h3 id="viewer-title" class="sheet-title">사진 보기</h3>
          <button id="btn-close-detail" class="btn-close-modal" type="button" aria-label="닫기">×</button>
        </div>
        <div class="viewer-image-wrap">
          <img id="detail-photo-img" src="" alt="현장 사진">
        </div>
        <div class="viewer-meta-info">
          <p id="detail-photo-tag" style="font-weight: 600; color: var(--color-primary);"></p>
          <p id="detail-photo-note" style="margin-top: 4px;"></p>
          <p id="detail-photo-date" style="margin-top: 4px; font-size: 11px; color: var(--text-muted);"></p>
        </div>
      </div>
    </div>

    <!-- 2중 검증 사진 업로드 모달 시트 -->
    <div id="upload-modal" class="modal-overlay" role="dialog" aria-modal="true">
      <div class="modal-sheet">
        <div class="sheet-header">
          <div>
            <h3 class="sheet-title">현장 사진 등록</h3>
            <p id="upload-target-name" style="font-size: 11px; color: var(--color-primary); margin-top: 2px;">정북동토성 (대표 위치)</p>
          </div>
          <button id="btn-close-upload" class="btn-close-modal" type="button" aria-label="닫기">×</button>
        </div>

        <form id="upload-form" class="upload-form">
          <!-- 계절 선택 -->
          <div class="form-group">
            <label class="form-label">계절</label>
            <div class="chips-selector" id="season-chips">
              <label class="chip-option selected"><input type="radio" name="season" value="spring" checked hidden>봄</label>
              <label class="chip-option"><input type="radio" name="season" value="summer" hidden>여름</label>
              <label class="chip-option"><input type="radio" name="season" value="autumn" hidden>가을</label>
              <label class="chip-option"><input type="radio" name="season" value="winter" hidden>겨울</label>
            </div>
          </div>

          <!-- 빛/날씨 선택 -->
          <div class="form-group">
            <label class="form-label">빛 / 날씨</label>
            <div class="chips-selector" id="light-chips">
              <label class="chip-option selected"><input type="radio" name="lightCondition" value="sunrise" checked hidden>일출</label>
              <label class="chip-option"><input type="radio" name="lightCondition" value="clear" hidden>맑음</label>
              <label class="chip-option"><input type="radio" name="lightCondition" value="sunset" hidden>일몰</label>
              <label class="chip-option"><input type="radio" name="lightCondition" value="rain" hidden>비</label>
            </div>
          </div>

          <!-- 사진 파일 선택 박스 -->
          <div class="form-group">
            <label class="form-label">사진 파일 (JPEG/PNG)</label>
            <label for="photo-file-input" class="file-upload-box">
              <span class="upload-icon">📷</span>
              <span class="upload-main-text" id="file-name-preview">사진 선택하기</span>
              <span class="upload-sub-text">현장 반경 500m 이내 촬영 원본 (위치 정보 필수)</span>
            </label>
            <input
              type="file"
              id="photo-file-input"
              accept="image/jpeg,image/png,image/jpg"
              style="display: none;"
              required
            >
          </div>

          <!-- 사진 메모 입력 -->
          <div class="form-group">
            <label class="form-label" for="photo-memo-input">사진 메모 (선택)</label>
            <input
              type="text"
              id="photo-memo-input"
              maxlength="30"
              placeholder="예: 해질녘 토성 앞 노을빛"
              style="width: 100%; padding: 10px 12px; border: 1px solid var(--bg-border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-sans);"
            >
          </div>

          <!-- 2중 위치 검증 피드백 및 차단 사유 카드 (최소 11px 보장) -->
          <div id="validation-feedback-card" class="validation-feedback-box">
            <div id="feedback-title" class="feedback-title"></div>
            <div id="feedback-message" class="feedback-message"></div>
            <div id="feedback-hint" class="feedback-hint"></div>
          </div>

          <!-- 등록 버튼 -->
          <button type="submit" id="btn-submit-photo" class="btn-submit-upload" disabled>
            위치 검증 후 등록하기
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- 일반 스크립트는 의존 순서대로 로드합니다. -->
  <script src="geo-calculator.js"></script>
  <script src="exif-gps-reader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <script src="spots-data.js"></script>
  <script src="image-compressor.js"></script>
  <script src="upload-validator.js"></script>
  <script src="app.js"></script>
</body>
</html>
